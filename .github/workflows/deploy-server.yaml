name: Deploy server to Cloud Run

# Builds server/ with Cloud Build and deploys it to Cloud Run (serverless mode).
# GCP access uses Workload Identity Federation (no service account key);
# the provider only trusts this repository. See server/cloudrun/README.ko.md.
on:
  push:
    branches: [master, claude/bark-app-development-n625ef]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yaml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: heekeun-smarthome
  REGION: asia-northeast3
  SERVICE: homepush
  WIF_PROVIDER: projects/190000626695/locations/global/workloadIdentityPools/github/providers/bark-piiziy
  DEPLOY_SA: github-deploy@heekeun-smarthome.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: server/cloudrun/deploy.sh
        env:
          SKIP_SETUP: "1"
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: 2M7Z8SF8B4
          APNS_TOPIC: com.piiziy.homepush
          # true while the app is installed from Xcode; set the repo variable
          # APNS_SANDBOX=false once you switch to TestFlight builds.
          APNS_SANDBOX: ${{ vars.APNS_SANDBOX || 'true' }}
          DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
