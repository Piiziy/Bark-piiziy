name: Deploy to TestFlight

# Builds the iOS app, signs it with fastlane match and uploads it to TestFlight.
# Runs on app changes pushed to the branches below, or manually.
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY (App Store Connect API key),
#          MATCH_GIT_PRIVATE_KEY (deploy key of Piiziy/homepush-certificates),
#          MATCH_PASSWORD, HOMEPUSH_PUSH_URL (optional build notification).
# Variable: MATCH_READONLY ("false" only while certificates still need creating).
on:
  push:
    branches: [master, claude/bark-app-development-n625ef]
    paths-ignore:
      - "server/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/deploy-server.yaml"
      - ".github/workflows/tests.yaml"
      - ".github/workflows/deploy-docs.yaml"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 1.1.0). Empty keeps the project value."
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: actions/cache@v5
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        run: pod install

      - name: Load certificate repo deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Build & upload to TestFlight
        run: bundle exec fastlane beta version:"${{ inputs.version }}"
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: ${{ vars.MATCH_READONLY || 'true' }}
          HOMEPUSH_PUSH_URL: ${{ secrets.HOMEPUSH_PUSH_URL }}

      - name: Archive dSYM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dSYM
          path: Bark.app.dSYM.zip
          if-no-files-found: ignore
